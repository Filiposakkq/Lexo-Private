<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Aside</title>
<link rel="icon" type="image/png" href="/aside.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><img src="/aside.png" alt="" width="26" height="26"><span id="brandText">Aside</span></div>
    <div class="project-chip" id="projectChip" title="Translation folder" data-i18n-title="Translation folder">
      <span id="projectPath">—</span>
      <button class="btn small" id="changeProject" data-i18n="Change…">Change…</button>
    </div>
    <div class="spacer"></div>
    <button class="btn icon" id="newWinBtn" title="Open a second window with the line detail (scene, check, proofreading…); it follows the line selected here" data-i18n-title="Open a second window with the line detail (scene, check, proofreading…); it follows the line selected here">⧉</button>
    <button class="btn icon" id="focusBtn" title="Focus mode: hides the top bar and the tabs (Ctrl+Shift+F)" data-i18n-title="Focus mode: hides the top bar and the tabs (Ctrl+Shift+F)">◩</button>
    <button class="btn icon" id="fullBtn" title="Full screen (F11)" data-i18n-title="Full screen (F11)">⛶</button>
    <button class="btn icon" id="densityBtn" title="Table density" data-i18n-title="Table density">≡</button>
    <button class="btn icon" id="themeBtn" title="Appearance: automatic / dark / light" data-i18n-title="Appearance: automatic / dark / light">◐</button>
    <button class="btn" id="undoBtn" title="Undo the last change (Ctrl+Z)" data-i18n-title="Undo the last change (Ctrl+Z)" data-i18n="↶ Undo" disabled>↶ Undo</button>
    <button class="btn" id="refreshBtn" title="Reload the .rpy files (F5)" data-i18n-title="Reload the .rpy files (F5)" data-i18n="⟳ Refresh files">⟳ Refresh files</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections" data-i18n-aria="Sections"></nav>
  <main id="view" tabindex="-1"></main>
  <footer class="statusbar">
    <span id="statusText" data-i18n="Ready">Ready</span>
    <span class="spacer"></span>
    <span id="statusRight" class="muted"></span>
  </footer>
</div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script type="module" src="/js/99-boot.js"></script>
</body>
</html>
