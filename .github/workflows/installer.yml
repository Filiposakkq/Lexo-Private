name: Installer

# The installer takes a release build of the whole application (about 15 minutes without a cache), so it runs only when something that goes into it changes, on main (which
# saves the cache for the pull requests) and on request (Actions, Installer, Run workflow); not on pull requests, they cost too many minutes; the rest of the port is checked by "Rust port".
on:
  push:
    branches: [main]
    paths: ["rust/**", "rust/resources/ui-classic/**", "rust/resources/packs/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

# a new push to a pull request cancels the run of the older push (it would be thrown away anyway)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    # The installer of the application (Tauri bundler, NSIS): installed silently into a folder and the UI self-test runs from the INSTALLED copy, which proves that the UI files
    # and the language packs are found next to the program.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: installer
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the installer
        working-directory: rust/crates/lexo-app
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis -- --locked
      - name: Install silently and run the self-test of the installed application
        shell: pwsh
        run: |
          $setup = Get-ChildItem rust/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          $dir = Join-Path $env:RUNNER_TEMP "aside-installed"
          $i = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -PassThru -Wait
          Get-ChildItem $dir | Select-Object -ExpandProperty Name
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          foreach ($need in "ui\index.html", "packs\cs\pack.json", "tools\unrpyc\v1\unrpyc.py", "tools\unrpyc\v2\unrpyc.py", "tools\unrpyc\v2\LICENSE") { if (-not (Test-Path (Join-Path $dir $need))) { throw "the installer did not install $need" } }
          # hide the folders of the repository, so that the installed copy cannot fall back to them
          Rename-Item rust/resources/ui-classic ui_hidden
          Rename-Item rust/resources/packs packs_hidden
          Rename-Item rust/resources/tools tools_hidden
          $env:LEXO_SELFTEST = "1"
          $p = Start-Process -FilePath $exe.FullName -RedirectStandardOutput selftest.out -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Get-Content selftest.out; throw "the self-test did not finish" }
          Get-Content selftest.out
          if ((Get-Content selftest.out -Raw) -notmatch "139/139") { throw "the self-test of the installed application did not pass" }
      - uses: actions/upload-artifact@v6
        with:
          name: aside-installer
          path: rust/target/release/bundle/nsis/*.exe
          retention-days: 14
