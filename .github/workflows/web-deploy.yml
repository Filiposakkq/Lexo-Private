name: Deploy website

# The website and its server (web/, one Cloudflare Worker "aside-web" with the D1 database "aside-web"), separate from the licence server
# (server-deploy.yml): its own Worker, database, secrets and queue, so the two never touch each other.
# - a pull request that changes web/: the checks only (tests, typecheck, generated pages up to date)
# - a merge to main that changes web/, or "Run workflow" in the Actions tab (also from the GitHub app): the checks, then the new tables
#   of web/worker/migrations (if any) and the deploy
# It uses the same GitHub secrets as the licence server: CLOUDFLARE_API_TOKEN (with "Edit Cloudflare Workers" and D1 Edit) and
# CLOUDFLARE_ACCOUNT_ID. The secrets of the Worker itself (HASH_SALT, RESEND_API_KEY, ...) stay in Cloudflare; a deploy does not touch them.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-deploy.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/worker/package-lock.json
      - name: Install
        working-directory: web/worker
        run: npm ci
      - name: Typecheck
        working-directory: web/worker
        run: npm run typecheck
      - name: Tests
        working-directory: web/worker
        run: npm test
      - name: Generated pages are up to date
        run: |
          python3 web/tools/build_pages.py
          git diff --exit-code -- web || { echo "Run python web/tools/build_pages.py and commit the pages it changed."; exit 1; }

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # the same environment as the licence server, so the Cloudflare secrets are found wherever they were added
    environment: production
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/worker/package-lock.json
      - name: Install
        working-directory: web/worker
        run: npm ci
      - name: Is the database set?
        id: db
        working-directory: web/worker
        run: |
          if grep -q 'database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The database_id in web/worker/wrangler.toml is still the placeholder: create the D1 database aside-web and put its id there."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: New tables
        if: env.HAS_TOKEN == 'true' && steps.db.outputs.ready == 'true'
        working-directory: web/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply aside-web --remote
      - name: Deploy
        if: env.HAS_TOKEN == 'true' && steps.db.outputs.ready == 'true'
        working-directory: web/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Deploy skipped
        if: env.HAS_TOKEN != 'true' || steps.db.outputs.ready != 'true'
        run: echo "Nothing was deployed (no CLOUDFLARE_API_TOKEN, or the database id is not set yet). The checks passed."
