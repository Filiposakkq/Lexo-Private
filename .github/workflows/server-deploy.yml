name: Deploy licence server

# After a merge to main that changes server/: typecheck and test, and only if both pass deploy the Worker to Cloudflare with `wrangler deploy`. Without the secret
# CLOUDFLARE_API_TOKEN the deploy step is skipped (the checks still run). The secrets are set in GitHub: Settings, Secrets and variables, Actions:
#   CLOUDFLARE_API_TOKEN  an API token with "Edit Cloudflare Workers" (and D1 edit if migrations are applied by hand with the same token)
#   CLOUDFLARE_ACCOUNT_ID the account id (Cloudflare dashboard, Workers and Pages, on the right)
# The secrets of the Worker itself (LICENCE_SIGNING_KEY, ADMIN_TOKEN, ...) stay in Cloudflare; a deploy does not touch them.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-licence-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # an environment lets you ask for a manual approval later (Settings, Environments, production, Required reviewers)
    environment: production
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Tests
        working-directory: server
        run: npm test
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Deploy skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set, so nothing was deployed (the checks above passed)."
