# Tests the Python reference implementation (Core and Free; the guards of the UI texts, the contract and the golden data among them) and runs the UI self-test against it.
# Read-only: no release, no deploy, nothing is pushed.
name: Free app

on:
  pull_request:
    paths: ["reference/python/**", "rust/resources/ui/**", "rust/resources/packs/**", "testdata/**", "pro/rust/ui/**", ".github/workflows/free.yml"]
  workflow_dispatch:

permissions:
  contents: read

# a new push to a pull request cancels the run of the older push (it would be thrown away anyway)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: reference/python/free
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Core tests, then Free tests
        run: python ../run_tests.py -v

  ui-selftest:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: reference/python/free
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - name: UI self-test in Edge
        run: python tests/ui/run_selftest_ci.py
