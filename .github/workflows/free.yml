# Tests the Free app. Read-only: no release, no deploy, nothing is pushed.
name: Free app

on:
  pull_request:
    paths: ["free/**", "core/**", ".github/workflows/free.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: free
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Core tests, then Free tests
        run: python ../run_tests.py -v

  ui-selftest:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: free
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - name: UI self-test in Edge
        run: python tests/ui/run_selftest_ci.py
