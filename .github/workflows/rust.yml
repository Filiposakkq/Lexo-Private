# Tests the Rust port of Core (docs/RUST-PORT.md). Read-only: no release, no deploy, nothing is pushed.
name: Rust port

on:
  pull_request:
    paths: ["rust/**", "core/golden/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (stable, with rustfmt and clippy)
        run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy --no-self-update
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Golden report (milestone M0: every case is still "todo")
        run: cargo run -q --locked -p lexo-golden
