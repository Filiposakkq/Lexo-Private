# Tests the Rust port of Core (docs/RUST-PORT.md). Read-only: no release, no deploy, nothing is pushed.
name: Rust port

on:
  pull_request:
    paths: ["rust/**", "core/golden/**", "free/lexo_free/ui/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]       # Linux finds path and encoding assumptions early
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (stable, with rustfmt and clippy)
        run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy --no-self-update
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Golden report (the groups that are ported pass, the others are "todo")
        run: cargo run -q --locked -p lexo-golden

  ui-selftest:
    # The UI self-test of Free (139 checks) against the Rust server: the same test as free.yml runs against the Python one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build the server
        working-directory: rust
        run: cargo build --locked -p lexo-server
      - name: UI self-test in Edge against the Rust server
        run: python rust/tools/run_ui_selftest.py --exe rust/target/debug/lexo-server.exe
