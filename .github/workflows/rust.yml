# Tests the Rust port of Core (docs/RUST-PORT.md). Read-only: no release, no deploy, nothing is pushed.
name: Rust port

on:
  pull_request:
    paths: ["rust/**", "pro/**", "core/golden/**", "free/lexo_free/ui/**", ".github/workflows/rust.yml"]
  push:
    # a run on main saves the build cache that the pull requests restore (a branch sees only its own caches and those of main)
    branches: [main]
    paths: ["rust/**", "pro/**", "core/golden/**", "free/lexo_free/ui/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]       # Linux finds path and encoding assumptions early
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (stable, with rustfmt and clippy)
        run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Golden report (the groups that are ported pass, the others are "todo")
        run: cargo run -q --locked -p lexo-golden

  ui-selftest:
    # The UI self-test of Free (139 checks) against the Rust server: the same test as free.yml runs against the Python one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: server
      - name: Build the server
        working-directory: rust
        run: cargo build --locked -p lexo-server
      - name: UI self-test in Edge against the Rust server
        run: python rust/tools/run_ui_selftest.py --exe rust/target/debug/lexo-server.exe

  app:
    # The Tauri application: built with the C++ tools of the runner, and the UI self-test (139 checks) runs inside its window.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: app
      - name: Build the application
        working-directory: rust
        run: cargo build --locked -p lexo-app
      - name: Clippy on the application
        working-directory: rust
        run: cargo clippy --locked -p lexo-app -- -D warnings
      - name: UI self-test inside the window of the application
        shell: pwsh
        run: |
          $env:LEXO_SELFTEST = "1"
          $p = Start-Process -FilePath "rust/target/debug/lexo-app.exe" -RedirectStandardOutput selftest.out -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Get-Content selftest.out; throw "the self-test did not finish" }
          Get-Content selftest.out
          if ((Get-Content selftest.out -Raw) -notmatch "139/139") { throw "the self-test did not pass" }

  pro:
    # The Pro pack in Rust (private): the same answers as the Python pack (pro/golden/pack.json), the sidecar protocol and publishing against local git repositories.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pro/rust
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (stable, with rustfmt and clippy)
        run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pro/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  installer:
    # The installer of the application (Tauri bundler, NSIS): installed silently into a folder and the UI self-test runs from the INSTALLED copy, which proves that the UI files
    # and the language packs are found next to the program.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: installer
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the installer
        working-directory: rust/crates/lexo-app
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis -- --locked
      - name: Install silently and run the self-test of the installed application
        shell: pwsh
        run: |
          $setup = Get-ChildItem rust/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          $dir = Join-Path $env:RUNNER_TEMP "lexo-installed"
          $i = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -PassThru -Wait
          Get-ChildItem $dir | Select-Object -ExpandProperty Name
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          foreach ($need in "ui\index.html", "packs\cs\pack.json") { if (-not (Test-Path (Join-Path $dir $need))) { throw "the installer did not install $need" } }
          # hide the folders of the repository, so that the installed copy cannot fall back to them
          Rename-Item free/lexo_free/ui ui_hidden
          Rename-Item core/lexo/packs packs_hidden
          $env:LEXO_SELFTEST = "1"
          $p = Start-Process -FilePath $exe.FullName -RedirectStandardOutput selftest.out -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Get-Content selftest.out; throw "the self-test did not finish" }
          Get-Content selftest.out
          if ((Get-Content selftest.out -Raw) -notmatch "139/139") { throw "the self-test of the installed application did not pass" }
      - uses: actions/upload-artifact@v5
        with:
          name: lexo-installer
          path: rust/target/release/bundle/nsis/*.exe
          retention-days: 14
