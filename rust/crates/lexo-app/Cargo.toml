[package]
name = "lexo-app"
description = "The Lexo application: a Tauri window around the UI, talking to lexo-core through the lexo:// protocol (docs/technical/RUST-PORT.md, milestone M8)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lexo-core = { path = "../lexo-core" }
lexo-server = { path = "../lexo-server" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
